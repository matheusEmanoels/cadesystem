<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Cadê? — Protótipo de baixa fidelidade</title>
  <desc id="descricao">Quatro telas ilustram o registro de um Documento X na Gaveta do escritório, sua busca, os detalhes e a mudança para a Caixa azul do armário. Nome e local são obrigatórios. Foto é opcional e data é automática. Os exemplos são fictícios.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #202020; }
      .titulo { font-size: 32px; font-weight: 700; }
      .subtitulo { font-size: 18px; fill: #505050; }
      .etapa { font-size: 19px; font-weight: 700; }
      .cabecalho { font-size: 23px; font-weight: 700; }
      .rotulo { font-size: 17px; font-weight: 700; }
      .texto { font-size: 17px; }
      .nota { font-size: 15px; fill: #555; }
      .botao { font-size: 17px; font-weight: 700; }
      .branco { fill: white; }
      .tela { fill: white; stroke: #333; stroke-width: 2; }
      .campo { fill: white; stroke: #777; stroke-width: 1.5; }
      .foto { fill: #f0f0f0; stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .primario { fill: #333; }
      .secundario { fill: white; stroke: #555; stroke-width: 1.5; }
    </style>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8" fill="none" stroke="#555" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1600" height="1020" fill="#fafafa"/>
  <text x="40" y="54" class="titulo">Cadê? · Protótipo de baixa fidelidade</text>
  <text x="40" y="86" class="subtitulo">Registrar → Buscar → Detalhes → Editar local · SCRUM-85 · Dados fictícios</text>

  <text x="40" y="137" class="etapa">1. Registrar onde guardou</text>
  <text x="430" y="137" class="etapa">2. Encontrar o registro</text>
  <text x="820" y="137" class="etapa">3. Consultar o local</text>
  <text x="1210" y="137" class="etapa">4. Atualizar o local</text>

  <g transform="translate(40 160)">
    <rect width="340" height="680" rx="18" class="tela"/>
    <path d="M0 82 H340" stroke="#ccc"/>
    <text x="24" y="48" class="cabecalho">Novo objeto</text>
    <text x="24" y="117" class="nota">* Campos obrigatórios</text>
    <text x="24" y="155" class="rotulo">Nome do objeto *</text>
    <rect x="24" y="168" width="292" height="52" rx="6" class="campo"/>
    <text x="38" y="201" class="texto">Documento X</text>
    <text x="316" y="241" text-anchor="end" class="nota">11 / 50</text>
    <text x="24" y="275" class="rotulo">Onde você guardou? *</text>
    <rect x="24" y="288" width="292" height="52" rx="6" class="campo"/>
    <text x="38" y="321" class="texto">Gaveta do escritório</text>
    <text x="24" y="379" class="rotulo">Foto (opcional)</text>
    <rect x="24" y="392" width="292" height="108" rx="6" class="foto"/>
    <text x="170" y="438" text-anchor="middle" class="texto">+ Adicionar foto</text>
    <text x="170" y="468" text-anchor="middle" class="nota">Pode salvar sem foto</text>
    <text x="24" y="536" class="nota">A data é preenchida ao salvar.</text>
    <rect x="24" y="562" width="292" height="52" rx="6" class="primario"/>
    <text x="170" y="595" text-anchor="middle" class="botao branco">Salvar objeto</text>
    <text x="170" y="650" text-anchor="middle" class="texto">Cancelar</text>
  </g>

  <g transform="translate(430 160)">
    <rect width="340" height="680" rx="18" class="tela"/>
    <path d="M0 82 H340" stroke="#ccc"/>
    <text x="24" y="48" class="cabecalho">Cadê?</text>
    <rect x="228" y="20" width="88" height="42" rx="6" class="secundario"/>
    <text x="272" y="47" text-anchor="middle" class="botao">+ Novo</text>
    <text x="24" y="121" class="rotulo">Buscar objeto</text>
    <rect x="24" y="136" width="292" height="52" rx="6" class="campo"/>
    <text x="38" y="169" class="texto">Documento</text>
    <text x="24" y="225" class="nota">1 resultado</text>
    <rect x="24" y="246" width="292" height="160" rx="8" class="campo"/>
    <rect x="38" y="264" width="64" height="64" rx="5" fill="#eee" stroke="#aaa"/>
    <path d="M53 278 H76 L87 289 V313 H53 Z M76 278 V290 H87" fill="none" stroke="#666" stroke-width="2"/>
    <text x="116" y="287" class="rotulo">Documento X</text>
    <text x="116" y="319" class="texto">Gaveta do</text>
    <text x="116" y="344" class="texto">escritório</text>
    <text x="38" y="384" class="nota">Toque para ver os detalhes →</text>
    <text x="24" y="451" class="nota">Sem foto: ícone padrão.</text>
    <text x="24" y="487" class="nota">A busca usa o nome do objeto.</text>
    <text x="24" y="633" class="nota">Após salvar, o registro aparece aqui.</text>
  </g>

  <g transform="translate(820 160)">
    <rect width="340" height="680" rx="18" class="tela"/>
    <path d="M0 82 H340" stroke="#ccc"/>
    <text x="24" y="48" class="cabecalho">← Detalhes</text>
    <rect x="24" y="106" width="292" height="158" rx="6" class="foto"/>
    <text x="170" y="179" text-anchor="middle" class="texto">Foto do objeto</text>
    <text x="170" y="209" text-anchor="middle" class="nota">Quando houver</text>
    <text x="24" y="307" class="cabecalho">Documento X</text>
    <text x="24" y="353" class="rotulo">Onde está guardado</text>
    <text x="24" y="386" class="texto">Gaveta do escritório</text>
    <text x="24" y="432" class="nota">Registrado em 25/10/2026</text>
    <rect x="24" y="470" width="292" height="52" rx="6" class="primario"/>
    <text x="170" y="503" text-anchor="middle" class="botao branco">Editar local</text>
    <rect x="24" y="538" width="292" height="48" rx="6" class="secundario"/>
    <text x="170" y="569" text-anchor="middle" class="botao">Excluir objeto</text>
    <text x="24" y="633" class="nota">Excluir exige confirmação.</text>
  </g>

  <g transform="translate(1210 160)">
    <rect width="340" height="680" rx="18" class="tela"/>
    <path d="M0 82 H340" stroke="#ccc"/>
    <text x="24" y="48" class="cabecalho">← Editar local</text>
    <text x="24" y="130" class="cabecalho">Documento X</text>
    <text x="24" y="176" class="nota">Local atual</text>
    <text x="24" y="207" class="texto">Gaveta do escritório</text>
    <text x="24" y="266" class="rotulo">Novo local *</text>
    <rect x="24" y="282" width="292" height="52" rx="6" class="campo"/>
    <text x="38" y="315" class="texto">Caixa azul do armário</text>
    <text x="24" y="369" class="nota">Campo em foco ao abrir a edição.</text>
    <rect x="24" y="404" width="292" height="52" rx="6" class="primario"/>
    <text x="170" y="437" text-anchor="middle" class="botao branco">Salvar local</text>
    <text x="170" y="499" text-anchor="middle" class="texto">Cancelar</text>
    <text x="24" y="568" class="nota">Ao salvar, volta aos detalhes</text>
    <text x="24" y="592" class="nota">com o novo local. A busca também</text>
    <text x="24" y="616" class="nota">deve mostrar a atualização.</text>
  </g>

  <path d="M390 490 H418" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M780 490 H808" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>
  <path d="M1170 490 H1198" stroke="#555" stroke-width="2" marker-end="url(#seta)"/>

  <text x="40" y="889" class="rotulo">Estados previstos</text>
  <text x="40" y="922" class="texto">Nome vazio ou acima de 50 caracteres: avisar e impedir salvar. Local vazio: avisar e impedir salvar.</text>
  <text x="40" y="952" class="texto">Sem resultados: “Nenhum objeto encontrado”. Sem foto ou permissão de câmera: continuar com nome e local.</text>
  <text x="40" y="992" class="nota">Esboço para revisão do fluxo. Não representa telas implementadas nem validação realizada com usuários.</text>
</svg>
